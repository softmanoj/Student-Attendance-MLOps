name: Attendance MLOps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  train-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull DVC dataset if remote is configured
        run: dvc pull || true

      - name: Reproduce synthetic dataset when DVC remote is unavailable
        run: |
          if [ ! -f data/student_attendance.csv ]; then
            python tools/generate_dataset.py
          fi

      - name: Train and compare models
        run: python train.py

      - name: Run tests
        run: pytest -q

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/attendance-api:latest
